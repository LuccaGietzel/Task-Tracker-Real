<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="style.css" rel="stylesheet">
    <script src="index.js" type="module" defer></script>
    <script
      src="https://kit.fontawesome.com/213476d10a.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="taskTrackerContainer">
      <h1>Task Tracker</h1>
      <form class="taskForm">
        <input
          class="taskTxtBox"
          placeholder="Start writing and press enter to create a task"
        >
        <button class="submitTask" type="submit">←</button>
      </form>
      <div class="tasksContainer"></div>
    </div>
  </body>
</html>
